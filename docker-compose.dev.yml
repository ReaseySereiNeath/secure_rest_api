version: "3.9"

services:
  api:
    build: .
    container_name: secure_rest_api_dev
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - ENV=dev
      - RUN_MIGRATIONS=true
      - RUN_SEED=true       # useful for local dev testing
    volumes:
      - .:/app              # live code updates (hot reload)
      - dev_db:/data        # persistent local DB
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

volumes:
  dev_db:
